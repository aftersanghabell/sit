# Publishes room/ (and only room/) to GitHub Pages.
# Settings -> Pages -> Source must be "GitHub Actions".
name: room
on:
  push:
    branches: [main]
    paths: ["room/**", ".github/workflows/room.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: room
      - id: deploy
        uses: actions/deploy-pages@v4
